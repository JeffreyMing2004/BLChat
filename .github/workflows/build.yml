name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: 1.20.x/forge-1.20,    java: "17" }
          - { project: 1.20.x/forge-1.20.2,  java: "17" }
          - { project: 1.20.x/forge-1.20.6,  java: "21" }
          - { project: 1.21.x/forge-1.21,    java: "21" }
          - { project: 1.21.x/forge-1.21.2,  java: "21" }
          - { project: 1.21.x/forge-1.21.6,  java: "21" }
          - { project: 1.21.x/forge-1.21.11, java: "21" }
          - { project: 26.1.x/forge-26.1,    java: "25" }
          - { project: 26.1.x/forge-26.1.1,  java: "25" }
          - { project: 26.1.x/forge-26.1.2,  java: "25" }
          - { project: 26.2.x/forge-26.2,    java: "25" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build
        working-directory: ${{ matrix.project }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.project }}
          if-no-files-found: error
          path: |
            ${{ matrix.project }}/build/libs/*.jar
            !${{ matrix.project }}/build/libs/*-sources.jar
            !${{ matrix.project }}/build/libs/*-javadoc.jar
